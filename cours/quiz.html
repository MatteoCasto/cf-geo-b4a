<!doctype html>
<html lang="fr-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quiz final</title>
<script src="config.js"></script>
<script src="app.js"></script>
</head>
<body>
<main class="doc">

<!--
  Quiz : une question par objet.
    q  : la question          o : les réponses proposées (2 à 6)
    a  : numéro de la bonne réponse, en partant de 0
    w  : explication affichée après la réponse
    ch : page du chapitre à revoir (le titre est pris dans config.js)
  Le score est mémorisé dans le navigateur de l'élève uniquement.
-->
<script type="application/json" data-quiz>
[
  {"q": "La coordonnée 2 538 214 / 1 152 387 est donnée…",
   "o": ["en MN03", "en MN95", "en WGS84", "on ne peut pas savoir"], "a": 1,
   "w": "Sept chiffres, l'est commence par 2 et le nord par 1 : c'est du MN95.", "ch": "referentiels.html"},
  {"q": "Pourquoi un récepteur GNSS a-t-il besoin d'au moins quatre satellites ?",
   "o": ["Pour avoir une marge de sécurité", "Trois inconnues de position et une inconnue de temps", "Un par point cardinal", "C'est une exigence légale"], "a": 1,
   "w": "E, N, h et le décalage de l'horloge du récepteur : quatre inconnues, donc quatre mesures au minimum.", "ch": "gnss.html"},
  {"q": "Un PDOP de 8 signifie…",
   "o": ["8 satellites sont utilisés", "une très bonne géométrie", "une mauvaise géométrie des satellites", "une précision de 8 mm"], "a": 2,
   "w": "Plus le PDOP est grand, plus la géométrie est mauvaise.", "ch": "gnss.html"},
  {"q": "Lecture arrière 1.520, lecture avant 0.870. La dénivelée vaut…",
   "o": ["−0.650 m", "+0.650 m", "+2.390 m", "−2.390 m"], "a": 1,
   "w": "Δh = AR − AV = 1.520 − 0.870 = +0.650 m : le point avant est plus haut.", "ch": "nivellement.html"},
  {"q": "Sous un bâtiment, le MNT LiDAR est…",
   "o": ["mesuré à travers le toit", "interpolé entre les points sol voisins", "égal à la hauteur du toit", "laissé vide dans tous les produits"], "a": 1,
   "w": "Le laser ne touche pas le sol sous un toit : le MNT y est interpolé.", "ch": "lidar.html"},
  {"q": "`ST_DWithin(b.geom, r.geom, 30)` en MN95 sélectionne…",
   "o": ["les objets à moins de 30 m", "les objets à moins de 30 km", "les 30 objets les plus proches", "les objets à moins de 30 degrés"], "a": 0,
   "w": "En MN95 (EPSG:2056), l'unité est le mètre.", "ch": "analyse.html"}
]
</script>

</main>
</body>
</html>
