<script type="text/markdown">
## Où est quoi

| Fichier | Contenu | Qui le modifie |
|---|---|---|
| `config.js` | Titre, version, **liste des chapitres**, en-têtes (chapeau, prérequis, objectifs…), libellés des encadrés | Auteurs |
| `xxx.html` | Le **texte** d'un chapitre, en Markdown, et ses éventuels composants interactifs | Auteurs |
| `style.css` | Couleurs, polices, mise en page (une seule colonne centrée) | Rarement |
| `app.js` | Moteur : menu, en-têtes, Markdown, quiz, numérotation, thème, appli hors ligne | Rarement |
| `annotations.js` | Annotations personnelles, export / import JSON | Rarement |
| `sw.js` | Cache hors ligne (la liste des pages vient de `config.js`) | Jamais |

Le menu, les liens précédent / suivant, le plan de l'accueil, l'en-tête de chaque chapitre et la numérotation des sections (1.1, 1.2…) sont **générés automatiquement** : on ne les écrit jamais à la main.

## Créer un chapitre

1. Copier `modele.html` (page vide prête à remplir) sous un nouveau nom, par ex. `dmav.html`.
2. Ajouter une entrée dans la liste `chapters` de `config.js` (titre, chapeau, prérequis, objectifs…). L'ordre de la liste est l'ordre du menu.
3. Écrire le texte dans le bloc `script type="text/markdown"` de la page (il peut y en avoir plusieurs, entrecoupés de composants HTML).

```js config.js (extrait)
{ file: 'dmav.html', num: '9', title: 'Le modèle DMAV',
  prereq: 'Outils et pratique', activity: 'exercice',
  info: { 'Fichiers': '.ili, .xtf' },          // cases libres de l'en-tête (facultatif)
  question: 'La question à laquelle le chapitre répond ?',
  lead: "Le chapeau : deux ou trois phrases d'introduction.",
  summary: "Le résumé affiché sur la page d'accueil.",
  tags: ['exercice'],
  goals: ['Premier objectif.', 'Deuxième objectif.'] },  // objectifs : référence pour les auteurs, non affichés
```

:::attention
Dans `config.js`, chaque texte est entre apostrophes `'…'` ou guillemets `"…"`. Si le texte contient une apostrophe (« l'attribut »), utiliser les guillemets. Ne pas oublier la virgule après chaque entrée.
:::

## Syntaxe du texte (Markdown)

Chaque exemple montre le rendu, puis ce qu'il faut écrire. Les espaces insécables avant `: ; ? !` sont ajoutées automatiquement.
</script>

## Quiz

Le quiz est décrit en JSON dans la page (voir `quiz.html`) ; la correction, le score et les liens « Revoir » sont gérés automatiquement.

```json quiz.html (extrait)
{"q": "La question ?",
 "o": ["Réponse A", "Réponse B", "Réponse C"],
 "a": 1,
 "w": "Explication affichée après la réponse.",
 "ch": "interlis2.html",
 "code": ["ili", "Espece -- {1} Espece;"]}
```

`code` est facultatif : un extrait affiché sous la question, sous la forme `["langage", "texte"]`.

## Composants interactifs

Les pages interactives (éditeur, banc d'essai, chasse aux erreurs…) mélangent du Markdown et du HTML. Les blocs ci-dessous sont les briques disponibles ; le code JavaScript de chaque composant se trouve en bas de sa page, avec un commentaire.

Un composant HTML se place **entre** deux blocs `script type="text/markdown"`. Si son script lit un élément écrit en Markdown (par ex. un compteur dans une phrase), il doit attendre que la page soit construite : `document.addEventListener('cours:ready', () => { … })`.

### Mots reliés entre blocs de code

Survoler un mot le surligne dans tous les blocs du même groupe : pratique pour relier un modèle et son fichier de transfert. Le bloc s'écrit en HTML, avec la liste des mots (`data-links`) et un nom de groupe (`data-group`).

<script type="text/markdown">
## Conventions d'écriture

- Phrases courtes, un fait par phrase. Vouvoiement.
- Nombres suisses : `2'600'000` ou `2 600 000`. Toujours préciser le cadre (MN95) et l'unité.
- Noms INTERLIS (classes, attributs) sans accents ni espaces : `NumeroInventaire`, `Espece`.
- Un seul fil rouge : Montavaux (commune fictive). Inventaire des arbres, modèle `Arbres_Communaux_V1` ; pour la mensuration officielle, les biens-fonds de la place (structure DM.01-AV-CH).
- Données fictives clairement signalées.
- Renvoyer à un autre chapitre par son **titre**, jamais par son numéro (« voir [Contrôler les données](controler.html) ») : les numéros changent quand on ajoute un chapitre. Même règle pour `prereq` dans `config.js`. Les tests refusent « chapitre 4 ».
- Numéros de figures : `Fig. N.x`, N = numéro du chapitre. Après un ajout ou un déplacement de chapitre, lancer `node tests/renumber-figures.mjs`.
- Ne jamais indiquer de nombre de périodes ni d'élèves, ni de durée de chapitre (données internes) : pas de champ `duration` dans `config.js`. Les durées indicatives d'exercice (`:::exo 10 min`) restent permises.
- Données d'un composant (fichier ITF, XTF à télécharger…) : dans un `<script type="text/plain" id="…">`, lu par le script de la page.
- Après une modification : ouvrir la page dans le navigateur, lancer `node tests/check.mjs` et `node tests/render.mjs`, puis `git commit` et `git push` : le site en ligne se met à jour tout seul.
</script>
