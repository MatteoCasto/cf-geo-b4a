## Où est quoi

| Fichier | Contenu | Qui le modifie |
|---|---|---|
| `config.js` | Titre, version, **liste des chapitres**, en-têtes (chapeau, durée, objectifs…), libellés des encadrés | Auteurs |
| `xxx.html` | Le **texte** d'un chapitre, en Markdown, et ses éventuels composants interactifs | Auteurs |
| `style.css` | Couleurs, polices, mise en page (une seule colonne centrée) | Rarement |
| `app.js` | Moteur : menu, en-têtes, Markdown, quiz, numérotation, thème, appli hors ligne | Rarement |
| `annotations.js` | Annotations personnelles, export / import JSON | Rarement |
| `sw.js` | Cache hors ligne (la liste des pages vient de `config.js`) | Jamais |

Le menu, les liens précédent / suivant, le plan de l'accueil, l'en-tête de chaque chapitre et la numérotation des sections (1.1, 1.2…) sont **générés automatiquement** : on ne les écrit jamais à la main.

## Créer un chapitre

1. Copier `modele.html` (page vide prête à remplir) sous un nouveau nom, par ex. `topographie.html`.
2. Ajouter une entrée dans la liste `chapters` de `config.js` (titre, durée, chapeau, objectifs…). L'ordre de la liste est l'ordre du menu.
3. Écrire le texte dans le bloc `script type="text/markdown"` de la page (il peut y en avoir plusieurs, entrecoupés de composants HTML).

```js config.js (extrait)
{ file: 'topographie.html', num: '7', title: 'Topographie',
  duration: '45 min', prereq: 'chapitre 3', activity: 'exercice',
  question: 'La question à laquelle le chapitre répond ?',
  lead: "Le chapeau : deux ou trois phrases d'introduction.",
  summary: "Le résumé affiché sur la page d'accueil.",
  tags: ['exercice'],
  goals: ['Premier objectif.', 'Deuxième objectif.'] },
```

:::attention
Dans `config.js`, chaque texte est entre apostrophes `'…'` ou guillemets `"…"`. Si le texte contient une apostrophe (« l'altitude »), utiliser les guillemets. Ne pas oublier la virgule après chaque entrée.
:::

## Syntaxe du texte (Markdown)

Chaque exemple montre le rendu, puis ce qu'il faut écrire. Les espaces insécables avant `: ; ? !` sont ajoutées automatiquement.

## Quiz

Le quiz est décrit en JSON dans la page (voir `quiz.html`) ; la correction, le score et les liens « Revoir » sont gérés automatiquement.

```json quiz.html (extrait)
{"q": "La question ?",
 "o": ["Réponse A", "Réponse B", "Réponse C"],
 "a": 1,
 "w": "Explication affichée après la réponse.",
 "ch": "gnss.html"}
```

Les pages interactives (carte, simulation, carnet…) mélangent du Markdown et du HTML. Les blocs ci-dessous sont les briques disponibles ; le code JavaScript de chaque composant se trouve en bas de sa page, avec un commentaire.

<script type="text/markdown">
## Conventions d'écriture

- Phrases courtes, un fait par phrase. Vouvoiement.
- Nombres suisses : `2'600'000` ou `2 600 000`. Toujours préciser le cadre (MN95) et l'unité.
- Données fictives clairement signalées.
- Après une modification : ouvrir la page dans le navigateur pour vérifier, puis `git commit` et `git push` : le site en ligne se met à jour tout seul.
</script>
