<script type="text/markdown">
## De INTERLIS 1 à INTERLIS 2

Les idées du chapitre [INTERLIS 1](interlis1.html) restent valables. Ce qui change, c'est surtout le vocabulaire et ce qu'on peut exprimer.

| Notion | INTERLIS 1 | INTERLIS 2 |
|---|---|---|
| En-tête | `TRANSFER Arbres;` | `INTERLIS 2.3;` |
| Modèle | `MODEL Nom` | `MODEL Nom (fr) AT "url" VERSION "date" =` |
| Type d'objet | `TABLE` | `CLASS` |
| Obligatoire | par défaut (`OPTIONAL` sinon) | `MANDATORY` (facultatif sinon) |
| Nombre avec unité | `[0.0 .. 60.0]`, unité en commentaire | `0.0 .. 60.0 [INTERLIS.m]` |
| Coordonnée | `COORD2 …` | `COORD … , … , ROTATION 2 -> 1` |
| Lien entre objets | relation `-> Espece` | `ASSOCIATION` avec cardinalités |
| Unicité | `IDENT` | `UNIQUE` |
| Héritage, structures | non | `EXTENDS`, `STRUCTURE`, `BAG OF` |
| Fichier de transfert | ITF, valeurs sans noms | XTF (XML), chaque valeur dans une balise nommée |

## Le modèle de Montavaux en INTERLIS 2

La commune veut maintenant inventorier aussi ses **haies**, et garder l'historique des **contrôles** de chaque arbre. Le modèle grandit. Voici d'abord son diagramme de classes.
</script>

<script type="text/x-code" data-lang="ili" data-file="Arbres_Communaux_V1.ili · INTERLIS 2.3" data-links="Coord2,EtatSanitaire,Controle,Espece,ObjetVegetal,Arbre,Haie" data-group="m2">
  INTERLIS 2.3;

  MODEL Arbres_Communaux_V1 (fr)
    AT "https://models.montavaux.ch"
    VERSION "2026-09-30" =

    DOMAIN
      Coord2 = COORD 2460000.000 .. 2870000.000 [INTERLIS.m],
                     1045000.000 .. 1310000.000 [INTERLIS.m],
                     ROTATION 2 -> 1;
      EtatSanitaire = (sain, affaibli, malade, mort);

    TOPIC Inventaire =

      STRUCTURE Controle =
        Date : MANDATORY INTERLIS.XMLDate;
        Remarque : TEXT*200;
      END Controle;

      CLASS Espece =
        NomLatin : MANDATORY TEXT*60;
        NomFrancais : TEXT*60;
      UNIQUE NomLatin;
      END Espece;

      CLASS ObjetVegetal (ABSTRACT) =
        NumeroInventaire : MANDATORY TEXT*10;
        Etat : MANDATORY EtatSanitaire;
        Controles : BAG {0..*} OF Controle;
      UNIQUE NumeroInventaire;
      END ObjetVegetal;

      CLASS Arbre EXTENDS ObjetVegetal =
        Hauteur : 0.0 .. 60.0 [INTERLIS.m];
        AnneePlantation : 1800 .. 2100;
        Position : MANDATORY Coord2;
      END Arbre;

      CLASS Haie EXTENDS ObjetVegetal =
        Trace : MANDATORY POLYLINE WITH (STRAIGHTS) VERTEX Coord2;
      END Haie;

      ASSOCIATION ArbreEspece =
        Arbre -- {0..*} Arbre;
        Espece -- {1} Espece;
      END ArbreEspece;

    END Inventaire;

  END Arbres_Communaux_V1.
</script>

<script type="text/markdown">
## Héritage : ABSTRACT et EXTENDS

Un arbre et une haie ont des choses en commun : un numéro d'inventaire, un état, des contrôles. Plutôt que de répéter ces attributs, on les place dans une classe générale, `ObjetVegetal`. `Arbre` et `Haie` l'**étendent** (`EXTENDS`) : ils reçoivent ses attributs, et ajoutent les leurs.

`ObjetVegetal` est **abstraite** (`ABSTRACT`) : il n'existe aucun objet qui soit « juste » un objet végétal. Chaque objet du fichier est soit un arbre, soit une haie.

:::retenir
Une sous-classe **est une sorte de** sa classe de base. On peut dire « un arbre est un objet végétal ». On ne peut pas dire « un arbre est une espèce » : l'espèce n'est donc pas une classe de base, c'est une association.
:::

## Structures : STRUCTURE et BAG OF

Un contrôle (date, remarque) n'a pas d'existence propre : il appartient à un arbre et disparaît avec lui. On le décrit comme une `STRUCTURE`. Une structure n'a pas d'identifiant et vit à l'intérieur d'un attribut.

`Controles : BAG {0..*} OF Controle;` signifie « un sac de zéro, un ou plusieurs contrôles ». `LIST OF` ferait la même chose, mais en gardant l'ordre.

<div class="two">
  <div class="box"><span class="lab">Classe</span><p>A une identité (TID), peut être référencée par d'autres objets, existe seule. <em>Ex. : Espece.</em></p></div>
  <div class="box"><span class="lab">Structure</span><p>N'a pas d'identité, vit à l'intérieur d'un objet, disparaît avec lui. <em>Ex. : Controle.</em></p></div>
</div>

## Associations et cardinalités {continu}

Une association relie deux classes. Chaque extrémité porte un **nom de rôle** et une **cardinalité** : le nombre d'objets qu'on peut trouver *de ce côté*.

```ili association
ASSOCIATION ArbreEspece =
  Arbre -- {0..*} Arbre;     !! une espèce concerne 0, 1 ou plusieurs arbres
  Espece -- {1} Espece;      !! un arbre a exactement 1 espèce
END ArbreEspece;
```

:::attention
La cardinalité se lit **depuis l'autre bout**. `Espece -- {1} Espece;` se lit : « depuis un arbre, on trouve exactement 1 espèce ». C'est le piège le plus fréquent. Testez-le ci-dessous.
:::

Choisissez les cardinalités, puis modifiez les liens. **Cliquez sur un arbre puis sur une espèce** pour créer un lien, et cliquez sur un lien pour le supprimer. Les objets qui violent les cardinalités s'affichent en rouge.
</script>

<script type="text/markdown">
| Cardinalité | Se lit |
|---|---|
| `{1}` | exactement un (obligatoire) |
| `{0..1}` | au plus un (facultatif) |
| `{1..*}` | au moins un |
| `{0..*}` | autant qu'on veut, y compris aucun |

Il existe aussi des associations plus fortes. `-<>` est une **agrégation** : le tout est formé de parties qui peuvent exister seules. `-<#>` est une **composition** : les parties disparaissent avec le tout, par exemple les bâtiments d'un bien-fonds dans certains modèles. La simple association `--` suffit dans la plupart des cas.

## Le fichier XTF {continu}

Le fichier de transfert d'INTERLIS 2 est un fichier XML. Chaque objet est un élément dont le nom est `Modèle.Thème.Classe`, avec un identifiant `TID`. Chaque attribut est une balise qui porte son nom. Survolez un nom pour le retrouver des deux côtés.
</script>

<script type="text/markdown">
---

:::retenir
- Le **HEADERSECTION** dit quel modèle (et quelle version) décrit les données.
- Le **DATASECTION** contient des **paniers** (*baskets*, identifiés par `BID`), un par thème livré.
- Les attributs hérités viennent **en premier**, dans l'ordre du modèle : `NumeroInventaire`, `Etat`, `Controles`, puis ceux d'`Arbre`.
- L'énumération est écrite **en toutes lettres** (`affaibli`), pas codée par un numéro comme en ITF.
- L'association devient une **référence** `<Espece REF="e1"/>` dans l'objet du côté où la cardinalité vaut au plus 1.
:::

:::terrain
Un vrai modèle n'écrit pas lui-même le domaine `Coord2` : il l'importe d'un modèle de base de la Confédération. C'est l'objet du chapitre suivant, [Importer et étendre](importer.html).
:::

## Le même arbre en XTF 2.4 {continu}

La version **INTERLIS 2.4** (norme eCH-0031) garde la même façon de modéliser : classes, héritage, associations s'écrivent comme en 2.3. C'est surtout le **fichier XTF** qui change. Le nouveau modèle de la mensuration officielle, le **DMAV**, est écrit en 2.4 : c'est ce format que vous recevrez et livrerez pour la MO. Survolez les noms pour comparer.
</script>

<script type="text/markdown">
---

| | XTF 2.3 | XTF 2.4 |
|---|---|---|
| Balises d'INTERLIS | majuscules : `TRANSFER`, `DATASECTION` | minuscules, préfixe `ili:` : `ili:transfer`, `ili:datasection` |
| Nom d'un objet | complet : `Modele.Theme.Classe` | court : `Classe`, le modèle est donné par l'espace de noms (`xmlns`) |
| Identifiants, références | `TID`, `BID`, `REF` | `ili:tid`, `ili:bid`, `ili:ref` |
| Coordonnées | `COORD`, `C1`, `C2` | `geom:coord`, `geom:c1`, `geom:c2` |
| Attributs | inchangés : `<NumeroInventaire>`, `<Etat>`, valeurs identiques | |

:::retenir
Le **modèle** dit lequel des deux formats s'applique : `INTERLIS 2.3;` ou `INTERLIS 2.4;` sur sa première ligne. Vous n'écrivez presque jamais un XTF à la main : les outils produisent le bon format. Mais vous devez savoir **lire** les deux, notamment dans un rapport d'erreurs.
:::

  const START = [[0,0],[1,0],[2,1],[3,1]];
  let links, pick = null;
  const reset = () => { links = START.map(l => l.slice()); pick = null; draw(); };
  const range = c => { const m = c.match(/\{(\d+)(?:\.\.(\d+|\*))?\}/); const lo = +m[1]; const hi = m[2] === undefined ? lo : m[2] === '*' ? Infinity : +m[2]; return [lo, hi]; };
  const TX = 40, SX = 300, W = 110, H = 34;
  const ty = i => 40 + i*62, sy = i => 70 + i*72;
  const say  = c => ({'{1}':'exactement une','{0..1}':'au plus une','{1..*}':'au moins une','{0..*}':'zéro, une ou plusieurs'}[c]);
  const sayM = c => ({'{1}':'exactement un','{0..1}':'au plus un','{1..*}':'au moins un','{0..*}':'zéro, un ou plusieurs'}[c]);
  function draw(){
    const cE = $('cE').value, cA = $('cA').value, [eLo,eHi] = range(cE), [aLo,aHi] = range(cA);
    const svg = $('bip'); svg.innerHTML = '';
    const mk = (t, a) => { const e = document.createElementNS(NS, t); for(const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; };
    mk('text', {x:TX, y:22, class:'hd'}).textContent = 'ARBRES';
    mk('text', {x:SX, y:22, class:'hd'}).textContent = 'ESPÈCES';
    const viol = [];
    links.forEach(([t, s], i) => {
      const l = mk('line', {x1:TX+W, y1:ty(t)+H/2, x2:SX, y2:sy(s)+H/2, class:'lk'});
      l.addEventListener('click', () => { links.splice(i, 1); draw(); });
      const tt = document.createElementNS(NS, 'title'); tt.textContent = 'Cliquer pour supprimer ce lien'; l.appendChild(tt);
    });
    TREES.forEach((n, i) => {
      const k = links.filter(l => l[0]===i).length, bad = k < eLo || k > eHi;
      if(bad) viol.push(`<strong>${n}</strong> a ${k} espèce${k>1?'s':''}, mais <code>Espece -- ${cE}</code> en exige ${say(cE)}.`);
      node(TX, ty(i), n, bad, pick === i, () => { pick = pick === i ? null : i; draw(); });
    });
    SPEC.forEach((n, j) => {
      const k = links.filter(l => l[1]===j).length, bad = k < aLo || k > aHi;
      if(bad) viol.push(`<strong>${n}</strong> concerne ${k} arbre${k>1?'s':''}, mais <code>Arbre -- ${cA}</code> en exige ${sayM(cA)}.`);
      node(SX, sy(j), n, bad, false, () => {
        if(pick === null) return;
        const ex = links.findIndex(l => l[0]===pick && l[1]===j);
        if(ex >= 0) links.splice(ex, 1); else links.push([pick, j]);
        pick = null; draw();
      });
    });
    $('uA').textContent = cA; $('uE').textContent = cE;
    $('reading').innerHTML = `Depuis un arbre, on trouve <strong>${say(cE)}</strong> espèce. Depuis une espèce, on trouve <strong>${sayM(cA)}</strong> arbre${cA==='{1}'||cA==='{0..1}'?'':'s'}.`;
    $('cardCode').replaceChildren(GEO.makeCodeBlock(`ASSOCIATION ArbreEspece =\n  Arbre -- ${cA} Arbre;\n  Espece -- ${cE} Espece;\nEND ArbreEspece;`, 'ili', 'association'));
    $('viol').innerHTML = viol.length
      ? viol.map(v => `<li><span class="chip err">erreur</span> ${v}</li>`).join('')
      : '<li><span class="chip ok">valide</span> Tous les objets respectent les cardinalités.</li>';
    if(pick !== null) $('viol').insertAdjacentHTML('afterbegin', `<li class="muted">Arbre ${TREES[pick]} sélectionné : cliquez sur une espèce.</li>`);
  }
  function node(x, y, label, bad, picked, onClick){
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'nd' + (bad ? ' bad' : '') + (picked ? ' pick' : ''));
    g.setAttribute('tabindex', '0'); g.setAttribute('role', 'button'); g.setAttribute('aria-label', label);
    g.innerHTML = `<rect x="${x}" y="${y}" width="${W}" height="${H}" rx="4"/><text x="${x+W/2}" y="${y+H/2+4.5}" text-anchor="middle">${label}</text>`;
    g.addEventListener('click', onClick);
    g.addEventListener('keydown', e => { if(e.key==='Enter' || e.key===' '){ e.preventDefault(); onClick(); } });
    $('bip').appendChild(g);
  }
  $('cE').onchange = $('cA').onchange = draw;
  $('bipReset').onclick = reset;
  reset();
})();
</script>
</body>
</html>
