<script type="text/markdown">
:::retenir
- **ili2c** contrôle un *modèle* (.ili).
- **ilivalidator** contrôle des *données* (.xtf, .itf) par rapport à leur modèle.
- **ili2db** (ili2pg, ili2gpkg…) fait le lien entre fichiers INTERLIS et bases de données : création du schéma, import, export.
- **QGIS Model Baker** rend tout cela accessible depuis QGIS, sans ligne de commande.
:::

## Les commandes essentielles

Model Baker suffit pour le quotidien. La ligne de commande reste utile pour automatiser, par exemple pour contrôler chaque nuit toutes les livraisons reçues. Chaque outil est un fichier `.jar` qu'on lance avec Java.

```sh terminal · aide-mémoire des commandes
# 1. compiler (vérifier) un modèle
java -jar ili2c.jar Arbres_Communaux_V1.ili

# 2. créer un GeoPackage vide à partir du modèle
java -jar ili2gpkg.jar --schemaimport --dbfile arbres.gpkg --defaultSrsCode 2056 Arbres_Communaux_V1.ili

# 3. importer un fichier de données dans ce GeoPackage
java -jar ili2gpkg.jar --import --dbfile arbres.gpkg arbres_montavaux.xtf

# 4. exporter la base vers un nouveau fichier XTF
java -jar ili2gpkg.jar --export --dbfile arbres.gpkg --models Arbres_Communaux_V1 livraison.xtf

# 5. contrôler le fichier avant de l'envoyer
java -jar ilivalidator.jar --log controle.log livraison.xtf

# même chose avec PostGIS : ili2pg et les paramètres de connexion
java -jar ili2pg.jar --schemaimport --dbhost localhost --dbdatabase geodata --dbschema arbres --dbusr moi --dbpwd ****** --models Arbres_Communaux_V1
```

:::attention
ili2db crée des tables et des colonnes dont les noms dérivent du modèle. Si vous modifiez ces tables à la main (renommer une colonne, changer un type), les exports vers XTF ne fonctionneront plus. Si le modèle change, recréez le schéma à partir du nouveau modèle.
:::

## Les dépôts de modèles

Dans les commandes ci-dessus, on n'indique jamais où se trouve le modèle `GeometryCHLV95_V1` importé par un modèle officiel. Les outils le trouvent seuls, dans les **dépôts de modèles** (*model repositories*). Un dépôt est un simple site web qui publie des fichiers `.ili` et un catalogue, `ilimodels.xml`. Les dépôts sont reliés entre eux par un fichier `ilisite.xml`.

```sh terminal
# indiquer soi-même où chercher : dossier courant, puis le dépôt central
java -jar ili2c.jar --modeldir ".;https://models.interlis.ch" Arbres_Communaux_V1.ili
```

:::terrain
Les modèles officiels de la Confédération (modèles de géodonnées minimaux, modèles de base) sont publiés dans le dépôt `models.geo.admin.ch`. On y accède depuis le point d'entrée `models.interlis.ch`. Beaucoup de cantons et d'organisations ont leur propre dépôt, relié au même réseau. Pour un modèle communal comme celui de Montavaux, la commune peut publier son propre dépôt, ou simplement fournir le fichier `.ili` avec les données.
:::

## La mensuration officielle et les autres modèles

| Modèle | Langage | Fichier | Rôle |
|---|---|---|---|
| **DM.01-AV-CH** | INTERLIS 1 | .itf | Modèle fédéral de la mensuration officielle depuis les années 1990 : points fixes, couverture du sol, biens-fonds, bâtiments, nomenclature… Les cantons le complètent par des extensions cantonales. |
| **DMAV** | INTERLIS 2.4 | .xtf | Nouveau modèle de la mensuration officielle, découpé en plusieurs modèles thématiques. En vigueur depuis le 1.1.2024. Il remplace DM.01-AV-CH : les cantons migrent leurs données d'ici au 31.12.2027. |
| **Modèles de géodonnées minimaux** (MGDM) | INTERLIS 2 | .xtf | Un modèle par jeu de géodonnées de base du droit fédéral : zones d'affectation, cadastre des sites pollués, dangers naturels, inventaires… Ils sont définis par les services fédéraux responsables. |
| Modèles cantonaux et communaux | INTERLIS 2 | .xtf | Pour les besoins propres d'un canton ou d'une commune. Ils étendent souvent un MGDM (`EXTENDS`). |

:::prof
Si le temps le permet, démonstration en direct dans QGIS : Model Baker → créer un GeoPackage depuis `Arbres_Communaux_V1.ili` (celui du chapitre INTERLIS 2, ou le fichier téléchargé depuis l'atelier), saisir deux arbres, exporter, valider. 10 minutes suffisent et marquent les esprits.

Calendrier DMAV vérifié en novembre 2026 (délai transitoire au 31.12.2027). Revoir l'état de la migration dans votre canton avant le cours.
:::

<script>
// ---- composants interactifs : chaîne d'outils, recherche dans les dépôts, situation → outil ----
(function(){
const $ = id => document.getElementById(id);

/* ---------- 7.1 chaîne ---------- */
const S = [
  {k:'file', ic:'.ili', b:'Modèle', s:'texte',
   h:"Le modèle", d:"Tout commence par le fichier <code>Arbres_Communaux_V1.ili</code>, écrit à la main ou exporté depuis un éditeur UML (par exemple l'UML/INTERLIS-Editor). C'est un simple fichier texte.", c:null},
  {k:'tool', ic:'ili2c', b:'Compiler', s:'contrôle du modèle',
   h:"ili2c : le compilateur", d:"ili2c lit le modèle et vérifie qu'il respecte le langage : syntaxe, noms, types, héritage, modèles importés. Il est appelé automatiquement par tous les autres outils. Un modèle qui ne compile pas ne peut pas être utilisé.",
   c:"java -jar ili2c.jar Arbres_Communaux_V1.ili"},
  {k:'tool', ic:'ili2db', b:'Créer la base', s:'--schemaimport',
   h:"ili2db : du modèle au schéma de base de données", d:"ili2db crée automatiquement les tables, colonnes, types, clés étrangères et listes de valeurs à partir du modèle. Il existe en plusieurs variantes : <code>ili2pg</code> (PostGIS), <code>ili2gpkg</code> (GeoPackage), <code>ili2fgdb</code> (FileGDB d'Esri)…",
   c:"java -jar ili2gpkg.jar --schemaimport --dbfile arbres.gpkg --defaultSrsCode 2056 Arbres_Communaux_V1.ili"},
  {k:'tool', ic:'QGIS', b:'Saisir', s:'Model Baker',
   h:"QGIS et Model Baker : saisir et mettre à jour", d:"Le plugin QGIS Model Baker pilote ili2db depuis QGIS. Il crée la base, puis génère un projet prêt à l'emploi : couches, formulaires avec listes déroulantes pour les énumérations, relations entre tables. On saisit les arbres comme dans n'importe quel projet QGIS.", c:null},
  {k:'tool', ic:'ili2db', b:'Exporter', s:'--export',
   h:"ili2db : de la base au fichier", d:"Le même outil exporte le contenu de la base dans un fichier XTF conforme au modèle. Dans Model Baker, c'est l'onglet d'export.",
   c:"java -jar ili2gpkg.jar --export --dbfile arbres.gpkg --models Arbres_Communaux_V1 livraison.xtf"},
  {k:'tool', ic:'ilival.', b:'Contrôler', s:'ilivalidator',
   h:"ilivalidator : le contrôle des données", d:"Avant d'envoyer le fichier, on le contrôle (chapitre Contrôler les données). ilivalidator vérifie les types, les obligatoires, les cardinalités, les références, l'unicité et les géométries. Model Baker l'intègre aussi, avec un panneau qui zoome sur chaque erreur.",
   c:"java -jar ilivalidator.jar --log controle.log livraison.xtf"},
  {k:'file', ic:'.xtf', b:'Livrer', s:'au canton',
   h:"La livraison", d:"Le fichier XTF contrôlé part chez le destinataire : commune, canton ou plateforme d'agrégation. De son côté, le destinataire contrôle à nouveau, puis importe avec ses propres outils, qui peuvent être complètement différents. C'est tout l'intérêt : seul le modèle est commun.", c:null},
];
const chain = $('chain');
chain.innerHTML = S.map((s,i)=>`<li><button type="button" aria-pressed="false" data-i="${i}"><span class="ic ${s.k}">${s.ic}</span><b>${s.b}</b><small>${s.s}</small></button></li>`).join('');
let cur = 0, timer = 0;
function show(i){
  cur = i;
  chain.querySelectorAll('button').forEach((b,j)=>{ b.setAttribute('aria-pressed', i===j); b.parentElement.classList.toggle('done', j < i); });
  const s = S[i], d = $('chainD');
  d.innerHTML = `<span class="kicker">Étape ${i+1} / ${S.length}</span><h4>${s.h}</h4><p>${s.d}</p>`;
  if(s.c) d.appendChild(GEO.makeCodeBlock(s.c, 'sh', 'terminal'));
}
function stop(){ clearInterval(timer); timer = 0; $('play').textContent = '▶ Lecture'; }
chain.querySelectorAll('button').forEach(b=>b.onclick = ()=>{ stop(); show(+b.dataset.i); });
$('play').onclick = ()=>{
  if(timer){ stop(); return; }
  $('play').textContent = '❚❚ Pause';
  if(cur >= S.length-1) show(0);
  timer = setInterval(()=>{ if(cur >= S.length-1){ stop(); return; } show(cur+1); }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 6000 : 4200);
};
show(0);

/* ---------- 7.3 recherche dans les dépôts ---------- */
const LOOK = [
  {w:'Le dossier courant', c:'.'},
  {w:'Le dépôt central, point d\'entrée du réseau', c:'models.interlis.ch/ilimodels.xml'},
  {w:'Les dépôts reliés (lus dans ilisite.xml)', c:'models.geo.admin.ch/ilimodels.xml'},
];
const CASES = [
  {hit:0, t:"Le modèle communal est dans le dossier courant, à côté des données : la recherche s'arrête dès la première étape."},
  {hit:2, t:"Le modèle de base de la Confédération n'est pas dans le dossier courant, ni dans le dépôt central lui-même. ili2c suit les liens de ilisite.xml et le trouve dans le dépôt de la Confédération. Il le télécharge et le garde en cache."},
];
let lkT = [];
function look(m){
  lkT.forEach(clearTimeout); lkT = [];
  document.querySelectorAll('#lkSeg button').forEach(b=>b.setAttribute('aria-pressed', +b.dataset.m === m));
  const ol = $('look');
  ol.innerHTML = LOOK.map(l=>`<li><span class="res"></span>${l.w}<br><code>${l.c}</code></li>`).join('');
  $('lkTxt').textContent = '';
  const li = [...ol.children], hit = CASES[m].hit;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const step = (k)=>{
    li.forEach(x=>x.classList.remove('cur'));
    if(k > hit){ $('lkTxt').textContent = CASES[m].t; return; }
    li[k].classList.add(k === hit ? 'hit' : 'cur');
    if(k < hit) lkT.push(setTimeout(()=>{ li[k].classList.remove('cur'); li[k].classList.add('miss'); li[k].querySelector('.res').textContent = 'absent'; step(k+1); }, reduce ? 0 : 800));
    else { li[k].querySelector('.res').textContent = 'trouvé ✓'; lkT.push(setTimeout(()=>step(k+1), reduce ? 0 : 400)); }
  };
  step(0);
}
document.querySelectorAll('#lkSeg button').forEach(b=>b.onclick = ()=>look(+b.dataset.m));
look(0);

/* ---------- 7.5 associations situation / outil ---------- */
const TOOLS = ['— choisir —','ili2c','ili2db --schemaimport','ili2db --import','ili2db --export','ilivalidator','QGIS Model Baker','dépôt de modèles'];
const Q = [
  {s:"Vous venez d'écrire un modèle et voulez savoir s'il est correct.", ok:['ili2c'], fb:"ili2c contrôle les modèles. ilivalidator, lui, contrôle des données."},
  {s:"Vous devez créer une base PostGIS vide, prête à recevoir des données conformes à un modèle.", ok:['ili2db --schemaimport','QGIS Model Baker'], fb:"ili2pg --schemaimport, ou Model Baker qui l'appelle pour vous."},
  {s:"Le canton vous envoie un fichier .xtf, vous voulez le voir dans QGIS.", ok:['QGIS Model Baker','ili2db --import'], fb:"Model Baker (le plus simple), ou ili2gpkg --import puis ouverture du GeoPackage."},
  {s:"Avant de livrer votre fichier, vous voulez être sûr qu'il sera accepté.", ok:['ilivalidator'], fb:"ilivalidator, directement ou via le panneau de validation de Model Baker."},
  {s:"Vous cherchez le modèle officiel des zones d'affectation.", ok:['dépôt de modèles'], fb:"Il est publié dans le dépôt de la Confédération, accessible via models.interlis.ch."},
  {s:"Votre base est à jour, vous devez produire le fichier de livraison.", ok:['ili2db --export','QGIS Model Baker'], fb:"ili2db --export, ou l'export de Model Baker."},
];
const tb = document.querySelector('#match tbody');
tb.innerHTML = Q.map((q,i)=>`<tr><td>${q.s}</td><td><select aria-label="Outil pour la situation ${i+1}">${TOOLS.map(t=>`<option>${t}</option>`).join('')}</select></td><td class="fb"></td></tr>`).join('');
const upd = ()=>{ const n = tb.querySelectorAll('tr.good').length; $('matchScore').textContent = tb.querySelector('tr.good,tr.bad') ? `${n} / ${Q.length} correct${n>1?'es':'e'}.` : ''; };
tb.querySelectorAll('tr').forEach((tr,i)=>{
  const s = tr.querySelector('select');
  s.onchange = ()=>{
    tr.classList.remove('good','bad');
    if(!s.selectedIndex){ tr.querySelector('.fb').textContent = ''; upd(); return; }
    const ok = Q[i].ok.includes(s.value);
    tr.classList.add(ok ? 'good' : 'bad');
    tr.querySelector('.fb').textContent = (ok ? 'Oui. ' : 'Non. ') + Q[i].fb;
    upd();
  };
});
})();
</script>
