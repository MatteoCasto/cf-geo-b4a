Réglez la distance. La bande rouge est la zone tampon autour du ruisseau du Moulin ; les bâtiments qui la touchent sont sélectionnés. Le code plus bas suit votre réglage.

<script type="text/markdown">
:::retenir
Pour une sélection par distance, inutile de calculer le tampon : `ST_DWithin(a, b, d)` répond directement « a est-il à moins de d de b ? » et profite de l'index spatial.
:::

:::attention
Une distance en mètres n'a de sens que dans un système projeté. En MN95 (EPSG:2056), l'unité est le mètre. En WGS84 (EPSG:4326), l'unité est le degré.
:::

:::terrain
Le même raisonnement s'applique dans QGIS : outil *Tampon* puis *Extraire par localisation*.
:::

## À vous

<script>
// ---- composant interactif : zone tampon + code lié ----
(function(){
  const $ = id => document.getElementById(id);
  const RIV = [[0,80],[70,95],[130,140],[170,210],[240,235],[300,205],[350,150],[410,130],[470,160],[520,215],[560,240],[600,250]];
  const dRiv = 'M' + RIV.map(p => p.join(' ')).join('L');
  $('riv').setAttribute('d', dRiv); $('buf').setAttribute('d', dRiv);
  const segDist = (px, py, [ax, ay], [bx, by]) => { const dx = bx-ax, dy = by-ay, t = Math.max(0, Math.min(1, ((px-ax)*dx + (py-ay)*dy) / (dx*dx + dy*dy))); return Math.hypot(px - ax - t*dx, py - ay - t*dy); };
  const ptRiv = (x, y) => { let m = Infinity; for(let i = 1; i < RIV.length; i++) m = Math.min(m, segDist(x, y, RIV[i-1], RIV[i])); return m; };
  const rectRiv = b => {
    let m = Math.min(...[[b.x,b.y],[b.x+b.w,b.y],[b.x,b.y+b.h],[b.x+b.w,b.y+b.h]].map(([x,y]) => ptRiv(x, y)));
    RIV.forEach(([x, y]) => { const dx = Math.max(b.x - x, 0, x - b.x - b.w), dy = Math.max(b.y - y, 0, y - b.y - b.h); m = Math.min(m, Math.hypot(dx, dy)); });
    return m;
  };
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const B = [];
  for(let k = 0; B.length < 46 && k < 4000; k++){
    const w = 12 + rnd()*14, h = 10 + rnd()*12, x = 10 + rnd()*(570 - w), y = 10 + rnd()*(350 - h), b = {x, y, w, h};
    if(rectRiv(b) < 6) continue;
    if(B.some(o => x < o.x + o.w + 8 && x + w + 8 > o.x && y < o.y + o.h + 8 && y + h + 8 > o.y)) continue;
    if(Math.abs(x + w/2 - (415 + 20*Math.sin(y/60))) < 22) continue;
    if(y + h > 290 && y < 345) continue;
    b.d = rectRiv(b); b.id = 190000000 + Math.floor(rnd()*900000);
    B.push(b);
  }
  $('bld').innerHTML = B.map((b, i) => `<rect class="b" data-i="${i}" x="${b.x.toFixed(1)}" y="${b.y.toFixed(1)}" width="${b.w.toFixed(1)}" height="${b.h.toFixed(1)}"><title>EGID ${b.id} · ${b.d.toFixed(1)} m</title></rect>`).join('');
  $('nt').textContent = B.length;
  const CODE = {
    sql: d => `-- Bâtiments à moins de ${d} m du ruisseau (MN95, EPSG:2056)
SELECT b.egid, b.adresse
FROM batiments AS b
JOIN cours_eau AS r ON r.nom = 'Ruisseau du Moulin'
WHERE ST_DWithin(b.geom, r.geom, ${d});`,
    py: d => `import geopandas as gpd

bat = gpd.read_file("montavaux.gpkg", layer="batiments")
eau = gpd.read_file("montavaux.gpkg", layer="cours_eau")

ruisseau = eau[eau.nom == "Ruisseau du Moulin"].geometry.union_all()
proches = bat[bat.distance(ruisseau) <= ${d}]   # mètres, car MN95
print(len(proches), "bâtiments")`
  };
  const files = {sql: 'selection_distance.sql', py: 'selection_distance.py'};
  let tab = 'sql';
  function update(){
    const d = +$('d').value;
    $('dV').textContent = d + ' m';
    $('buf').setAttribute('stroke-width', 2*d);
    const sel = [];
    $('bld').querySelectorAll('rect').forEach(r => { const b = B[+r.dataset.i], inn = b.d <= d; r.classList.toggle('in', inn); if(inn) sel.push(b.id); });
    $('nb').textContent = sel.length;
    $('ids').textContent = sel.length ? sel.sort().join(' · ') : 'aucun';
    $('code').replaceChildren(GEO.makeCodeBlock(CODE[tab](d), tab, files[tab]));
  }
  $('tabs').onclick = e => { const b = e.target.closest('button'); if(!b) return; tab = b.dataset.t;
    $('tabs').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); update(); };
  $('d').oninput = update;
  update();
})();
</script>
