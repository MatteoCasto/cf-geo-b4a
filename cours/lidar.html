<!doctype html>
<html lang="fr-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LiDAR et modèles de terrain</title>
<script src="config.js"></script>
<script src="app.js"></script>
<style>
/* styles propres aux composants interactifs de cette page */
#prof .ax line,#prof .ax path{stroke:var(--rule);stroke-width:1;fill:none}
#prof .ax text{font:500 10px var(--f-mono);fill:var(--muted)}
#prof .mnt{fill:none;stroke:var(--cl-sol);stroke-width:2.4}
#prof .mns{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-dasharray:5 3}
#prof .cur{stroke:var(--accent);stroke-width:1.4}
#prof .nh{stroke:var(--accent);stroke-width:4;opacity:.35}
.classes{display:flex;flex-direction:column;gap:6px;margin:.4rem 0 .8rem}
</style>
</head>
<body>
<main class="doc">

<script type="text/markdown">
## Un profil dans le nuage

Ce profil de 200 m traverse une forêt, un bâtiment et une haie (données simulées). Masquez des classes, affichez les surfaces, et déplacez le curseur pour lire les hauteurs.
</script>

<!-- composant interactif : profil LiDAR -->
<div class="fig">
  <svg id="prof" viewBox="0 0 760 320" role="img" aria-label="Profil de nuage de points LiDAR coloré par classe, avec courbes MNT et MNS"></svg>
  <div class="ctrl"><label for="cx">Position sur le profil <output id="cxV"></output></label><input id="cx" type="range" min="0" max="200" step="0.5" value="45"></div>
  <p class="cap">Fig. 4.1 · Profil simulé, altitudes en m. Trait plein : MNT ; tirets : MNS ; barre rouge : hauteur au-dessus du sol.</p>
</div>
<div class="tool-panel">
  <div>
    <h3 style="margin-top:0">Classes affichées</h3>
    <div class="classes" id="cls"></div>
    <label class="check"><input type="checkbox" id="sMNT" checked> Surface MNT (terrain)</label>
    <label class="check"><input type="checkbox" id="sMNS"> Surface MNS (surface)</label>
  </div>
  <dl class="readout">
    <dt>MNT</dt><dd id="rMNT">–</dd>
    <dt>MNS</dt><dd id="rMNS">–</dd>
    <dt>MNS − MNT</dt><dd id="rNH">–</dd>
    <dt>Points visibles</dt><dd id="rN">–</dd>
  </dl>
</div>

<script type="text/markdown">
| Code | Classe (ASPRS) | Exemple |
|---|---|---|
| 2 | Sol | Terrain, routes, prés |
| 3 – 5 | Végétation basse, moyenne, haute | Haies, buissons, arbres |
| 6 | Bâtiment | Toits |
| 7 | Bruit | Oiseaux, réflexions parasites |

:::retenir
**MNT** : terrain nu, calculé avec les seuls points sol. **MNS** : surface la plus haute (toits, cimes). Leur différence, le **MNS normalisé**, donne la hauteur des objets.
:::

:::attention
Sous un bâtiment, le laser ne touche jamais le sol. Le MNT y est donc **interpolé** entre les points sol voisins : masquez le bâtiment et regardez la droite qui le traverse.
:::

:::terrain
swisstopo diffuse un nuage de points classé de toute la Suisse (swissSURFACE3D) et le modèle de terrain qui en découle (swissALTI3D).
:::

## À vous

:::exo question · 3 min
Placez le curseur au milieu de la forêt. Pourquoi le laser trouve-t-il encore des points sol, alors que les arbres couvrent tout ?

??? Réponse
Une impulsion laser peut produire plusieurs **échos** : une partie est renvoyée par les feuilles, le reste passe entre les branches et atteint le sol. Le dernier écho est souvent le sol.
???
:::
</script>

</main>
<script>
// ---- composant interactif : profil LiDAR (données simulées) ----
(function(){
  const $ = id => document.getElementById(id);
  let seed = 42; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const gauss = () => (rnd() + rnd() + rnd() - 1.5) * 0.8;
  const gz = x => 492 + 5*Math.sin(x/32) + 0.035*x + 1.2*Math.sin(x/7);
  const B = [118, 148, 9.5];
  const crown = x => (x > 15 && x < 82) ? 13 + 7*Math.sin(x/4.3) * Math.sin(x/11) + 3*Math.sin(x/2.1) : 0;
  const hedge = x => (x > 162 && x < 176) ? 1.6 + 0.4*Math.sin(x) : 0;
  const P = [];
  for(let x = 0; x <= 200; x += 0.35){
    const g = gz(x), c = crown(x), h = hedge(x);
    if(x >= B[0] && x <= B[1]){ P.push([x, g + B[2] + gauss()*0.08, 'bat']); continue; }
    if(c > 0){ P.push([x, g + c*(0.75 + 0.25*rnd()), 'veg']); if(rnd() < .5) P.push([x, g + c*rnd()*0.8, 'veg']); if(rnd() < .35) P.push([x, g + gauss()*0.05, 'sol']); }
    else if(h > 0){ P.push([x, g + h*rnd(), 'veg']); if(rnd() < .6) P.push([x, g + gauss()*0.05, 'sol']); }
    else P.push([x, g + gauss()*0.05, 'sol']);
  }
  [[60, 528], [101, 486.2], [190, 532.5]].forEach(([x, z]) => P.push([x, z, 'bruit']));
  const sol = P.filter(p => p[2] === 'sol').sort((a, b) => a[0] - b[0]);
  const mnt = x => { const i = sol.findIndex(p => p[0] >= x); if(i < 0) return sol[sol.length-1][1]; if(i === 0) return sol[0][1];
    const a = sol[i-1], b = sol[i]; return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0] || 1); };
  const bins = []; P.forEach(p => { if(p[2] === 'bruit') return; const k = Math.min(199, Math.floor(p[0])); bins[k] = Math.max(bins[k] ?? -1e9, p[1]); });
  const mns = x => bins[Math.min(199, Math.max(0, Math.floor(x)))];
  const L = 46, R = 744, T = 14, Bt = 290, Z0 = 484, Z1 = 536;
  const X = x => L + (R - L) * x / 200, Y = z => Bt - (Bt - T) * (z - Z0) / (Z1 - Z0);
  const svg = $('prof');
  let ax = `<g class="ax"><path d="M${L} ${T}V${Bt}H${R}"/>`;
  for(let z = 490; z <= 530; z += 10) ax += `<line x1="${L}" y1="${Y(z)}" x2="${R}" y2="${Y(z)}" stroke-dasharray="2 4"/><text x="${L-6}" y="${Y(z)+3}" text-anchor="end">${z}</text>`;
  for(let x = 0; x <= 200; x += 25) ax += `<text x="${X(x)}" y="${Bt+16}" text-anchor="middle">${x} m</text>`;
  svg.innerHTML = ax + '</g><g id="gPts"></g><path class="mnt" id="pMNT"/><path class="mns" id="pMNS"/><line class="nh" id="lNH"/><line class="cur" id="lCur"/>';
  const gp = svg.querySelector('#gPts');
  gp.innerHTML = P.map(p => `<circle class="p-${p[2]}" data-c="${p[2]}" cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${p[2]==='bruit'?3:1.7}"/>`).join('');
  let dT = '', dS = '';
  for(let x = 0; x <= 200; x += 0.5) dT += (x ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(mnt(x)).toFixed(1);
  for(let k = 0; k < 200; k++) dS += (k ? 'L' : 'M') + X(k).toFixed(1) + ' ' + Y(bins[k]).toFixed(1) + 'L' + X(k+1).toFixed(1) + ' ' + Y(bins[k]).toFixed(1);
  svg.querySelector('#pMNT').setAttribute('d', dT);
  svg.querySelector('#pMNS').setAttribute('d', dS);
  const CL = [['sol','Sol (2)'],['veg','Végétation (3–5)'],['bat','Bâtiment (6)'],['bruit','Bruit (7)']];
  const on = new Set(GEO.store.get('lidar.cls', ['sol','veg','bat','bruit']));
  $('cls').innerHTML = CL.map(([k, t]) => `<label class="check"><input type="checkbox" data-k="${k}"${on.has(k)?' checked':''}><span class="swatch" style="background:var(--cl-${k})"></span>${t} · <span class="muted small">${P.filter(p=>p[2]===k).length} pts</span></label>`).join('');
  function apply(){
    gp.querySelectorAll('circle').forEach(c => c.style.display = on.has(c.dataset.c) ? '' : 'none');
    $('rN').textContent = P.filter(p => on.has(p[2])).length;
    svg.querySelector('#pMNT').style.display = $('sMNT').checked ? '' : 'none';
    svg.querySelector('#pMNS').style.display = $('sMNS').checked ? '' : 'none';
    GEO.store.set('lidar.cls', [...on]);
  }
  function cursor(){
    const x = +$('cx').value, t = mnt(x), s = mns(x);
    $('cxV').textContent = x.toFixed(1) + ' m';
    $('rMNT').textContent = t.toFixed(2) + ' m'; $('rMNS').textContent = s.toFixed(2) + ' m'; $('rNH').textContent = (s - t).toFixed(2) + ' m';
    const l = svg.querySelector('#lCur'); l.setAttribute('x1', X(x)); l.setAttribute('x2', X(x)); l.setAttribute('y1', T); l.setAttribute('y2', Bt);
    const nh = svg.querySelector('#lNH'); nh.setAttribute('x1', X(x)); nh.setAttribute('x2', X(x)); nh.setAttribute('y1', Y(t)); nh.setAttribute('y2', Y(s));
  }
  $('cls').onchange = e => { const k = e.target.dataset.k; if(!k) return; e.target.checked ? on.add(k) : on.delete(k); apply(); };
  $('sMNT').onchange = $('sMNS').onchange = apply;
  $('cx').oninput = cursor;
  apply(); cursor();
})();
</script>
</body>
</html>
