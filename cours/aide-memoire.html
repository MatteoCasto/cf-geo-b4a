:::carte 1 · Systèmes de référence
$$ E ≈ Y + 2 000 000 $$
$$ N ≈ X + 1 000 000 $$
MN95 : 7 chiffres, E commence par 2, N par 1. Transformation rigoureuse : REFRAME.
:::

:::carte 2 · GNSS
- ≥ 4 satellites (E, N, h, temps).
- PDOP petit = bonne géométrie.
- Masque d'élévation : compromis nombre / qualité.
:::

:::carte 3 · Nivellement
$$ Δh = AR − AV $$
$$ Σ AR − Σ AV = Σ Δh $$
Boucle fermée : Σ Δh = écart de fermeture.
:::

:::carte 4 · LiDAR
- Classes : 2 sol, 3–5 végétation, 6 bâtiment, 7 bruit.
- MNT = terrain nu ; MNS = surface.
- MNS − MNT = hauteur des objets.
:::

:::carte 5 · Analyse spatiale
$$ ST_DWithin(a, b, d) $$
Distance en mètres seulement dans un système projeté (MN95 = EPSG:2056).
:::

:::carte Codes EPSG utiles
- `2056` MN95 / CH1903+
- `21781` MN03 / CH1903
- `4326` WGS84 (degrés)
:::
