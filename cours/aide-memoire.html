:::carte A · Squelette INTERLIS 1
```ili1 modele.ili · INTERLIS 1
TRANSFER Nom;
MODEL Modele
  DOMAIN
    CoordCH = COORD2 2460000.000 1045000.000
                     2870000.000 1310000.000;
  TOPIC Theme =
    TABLE Arbre =
      Numero : TEXT*10;              !! obligatoire
      Hauteur : OPTIONAL [0.0 .. 60.0];
      Etat : (sain, affaibli, malade, mort);
      Espece : -> Espece;            !! relation
      Position : CoordCH;
    IDENT Numero;
    END Arbre;
  END Theme.
END Modele.
FORMAT FREE;
CODE BLANK = DEFAULT, UNDEFINED = DEFAULT,
  CONTINUE = DEFAULT; TID = ANY; END.
```
:::

:::carte B · Squelette INTERLIS 2.3
```ili modele.ili · INTERLIS 2.3
INTERLIS 2.3;
MODEL Modele_V1 (fr) AT "https://…" VERSION "2026-09-30" =
  IMPORTS GeometryCHLV95_V1;
  TOPIC Theme =
    STRUCTURE Controle =
      Date : MANDATORY INTERLIS.XMLDate;
    END Controle;
    CLASS Objet (ABSTRACT) =
      Numero : MANDATORY TEXT*10;
      Controles : BAG {0..*} OF Controle;
    UNIQUE Numero;
    END Objet;
    CLASS Arbre EXTENDS Objet =
      Hauteur : 0.0 .. 60.0 [INTERLIS.m];
      Position : MANDATORY GeometryCHLV95_V1.Coord2;
    END Arbre;
    ASSOCIATION ArbreEspece =
      Arbre -- {0..*} Arbre;
      Espece -- {1} Espece;
    END ArbreEspece;
  END Theme;
END Modele_V1.
```
:::

:::carte C · INTERLIS 1 ou 2
| | ILI 1 | ILI 2 |
|---|---|---|
| Objet | `TABLE` | `CLASS` |
| Obligatoire | par défaut | `MANDATORY` |
| Facultatif | `OPTIONAL` | par défaut |
| Unicité | `IDENT` | `UNIQUE` |
| Lien | `-> Table` | `ASSOCIATION` |
| Fin de thème | `END Theme.` | `END Theme;` |
| Fichier | ITF, valeurs dans l'ordre | XTF, balises nommées |
| Énumération | numéro (0, 1, …) | en toutes lettres |
:::

:::carte D · Types INTERLIS 2
| `TEXT*60` | texte, 60 caractères au plus |
| `(a, b, c)` | énumération |
| `0.0 .. 60.0 [INTERLIS.m]` | nombre, plage, unité |
| `BOOLEAN` | vrai / faux |
| `INTERLIS.XMLDate` | date AAAA-MM-JJ |
| `COORD …` | point |
| `POLYLINE WITH (STRAIGHTS) VERTEX …` | ligne |
| `SURFACE …` / `AREA …` | surfaces libres / partition |
| `BAG {0..*} OF S` | plusieurs structures S |
:::

:::carte E · ITF : les mots-clés
| `SCNT … ////` | en-tête libre |
| `MTID` / `MODL` | nom du transfert / du modèle |
| `TOPI` … `ETOP` | début / fin de thème |
| `TABL` … `ETAB` | début / fin de table |
| `OBJE` | un objet : TID puis valeurs |
| `STPT LIPT ELIN` | début, point, fin de ligne |
| `EMOD` / `ENDE` | fin du modèle / du fichier |
| `@` · `_` | valeur non définie · espace dans un texte |
:::

:::carte F · XTF 2.3 : la structure
```xtf donnees.xtf
<TRANSFER xmlns="http://www.interlis.ch/INTERLIS2.3">
  <HEADERSECTION SENDER="…" VERSION="2.3">
    <MODELS><MODEL NAME="Modele_V1" VERSION="…" URI="…"/></MODELS>
  </HEADERSECTION>
  <DATASECTION>
    <Modele_V1.Theme BID="b1">
      <Modele_V1.Theme.Arbre TID="a42">
        <Numero>A-0042</Numero>
        <Position><COORD><C1>2538214.250</C1><C2>1152388.100</C2></COORD></Position>
        <Espece REF="e1"/>
      </Modele_V1.Theme.Arbre>
    </Modele_V1.Theme>
  </DATASECTION>
</TRANSFER>
```
:::

:::carte G · XTF 2.4 : ce qui change
```xtf donnees.xtf · INTERLIS 2.4
<ili:transfer xmlns:ili="http://www.interlis.ch/xtf/2.4/INTERLIS"
    xmlns:geom="http://www.interlis.ch/geometry/1.0"
    xmlns="http://www.interlis.ch/xtf/2.4/Modele_V1">
  <ili:headersection>
    <ili:models><ili:model>Modele_V1</ili:model></ili:models>
  </ili:headersection>
  <ili:datasection>
    <Theme ili:bid="b1">
      <Arbre ili:tid="a42">
        <Numero>A-0042</Numero>
        <Position><geom:coord><geom:c1>2538214.250</geom:c1><geom:c2>1152388.100</geom:c2></geom:coord></Position>
        <Espece ili:ref="e1"/>
      </Arbre>
    </Theme>
  </ili:datasection>
</ili:transfer>
```
:::

:::carte H · Cardinalités
| `{1}` | exactement un |
| `{0..1}` | au plus un |
| `{1..*}` | au moins un |
| `{0..*}` | quelconque |

**Se lit depuis l'autre bout :** `Espece -- {1} Espece;` = depuis un arbre, exactement une espèce.

`--` association · `-<>` agrégation · `-<#>` composition
:::

:::carte I · Contrôle : trois filtres
1. **Bien formé** : XML correct.
2. **Modèle** : types, plages, énumérations, obligatoires, références, coordonnées.
3. **Contraintes** : UNIQUE, CONSTRAINT, géométries, règles cantonales.

**Pièges classiques** : date `12.05.2026` au lieu de `2026-05-12` · casse d'une énumération (`Malade`) · coordonnées MN03 · virgule décimale · doublon d'identifiant · ordre des balises.
:::

:::carte J · Importer et étendre
```ili extension communale
INTERLIS 2.3;
MODEL Arbres_Montavaux_V1 (fr) AT "https://…" VERSION "…" =
  IMPORTS Arbres_Cantonaux_V1;
  TOPIC Arbres EXTENDS Arbres_Cantonaux_V1.Arbres =
    CLASS Arbre (EXTENDED) =
      Hauteur : 0.0 .. 60.0 [INTERLIS.m];
    END Arbre;
  END Arbres;
END Arbres_Montavaux_V1.
```
Modèles de base : `GeometryCHLV95_V1` · `Units` · `CHAdminCodes_V1` · `LocalisationCH_V1`. Une extension **ajoute** ou **resserre**, jamais ne retire ni n'élargit.
:::

:::carte K · Contraintes
```ili contraintes
UNIQUE Commune, NumeroInventaire;
!! si mort, alors date d'abattage prévue
MANDATORY CONSTRAINT Etat != #mort OR DEFINED(AbattagePrevu);
EXISTENCE CONSTRAINT CodeEspece REQUIRED IN EspeceCantonale : Code;
```
**Si A alors B** = `NOT (A) OR B` · `#valeur` = énumération · `DEFINED(x)` = renseigné. Rapport : `…Constraint1 is not true` = 1<sup>re</sup> contrainte de la classe.
:::

### Commandes

```sh terminal
java -jar ili2c.jar Modele_V1.ili                                        # contrôler un modèle
java -jar ili2gpkg.jar --schemaimport --dbfile d.gpkg --defaultSrsCode 2056 Modele_V1.ili   # créer la base
java -jar ili2gpkg.jar --import --dbfile d.gpkg donnees.xtf              # importer
java -jar ili2gpkg.jar --export --dbfile d.gpkg --models Modele_V1 sortie.xtf   # exporter
java -jar ilivalidator.jar --log controle.log sortie.xtf                 # contrôler des données
# option commune : --modeldir ".;https://models.interlis.ch"
```
