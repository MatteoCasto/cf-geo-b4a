<body>
<main class="doc">

<script type="text/markdown">
## Une station

Le niveau est posé entre deux mires. On lit d'abord la mire placée sur le point **connu** (lecture **arrière**), puis celle sur le point **à déterminer** (lecture **avant**).

$$ Δh = AR − AV $$
$$ H<sub>avant</sub> = H<sub>arrière</sub> + Δh $$

Si la lecture avant est plus petite, la mire est plus haute : le terrain monte.
</script>

<figure class="fig gridbg">

<script type="text/markdown">
## Le carnet qui se calcule

Voici un cheminement fermé : il part du repère **RP1** et y revient. Modifiez les lectures, ajoutez des stations : tout se recalcule. En boucle fermée, la somme des dénivelées devrait valoir zéro.
</script>

<!-- composant interactif : carnet de nivellement -->
<div class="row" style="margin-top:.4rem;margin-bottom:.2rem">
  <label class="small" for="h0">Altitude de départ (m)</label><input id="h0" type="number" step="0.001" value="452.318" style="width:7.5em">
  <label class="small" for="tol">Tolérance (mm)</label><input id="tol" type="number" step="0.5" value="4" style="width:4.5em">
  <button class="btn sm" type="button" id="add">+ station</button>
  <button class="btn sm" type="button" id="reset">Réinitialiser</button>
</div>
<div class="tbl">
<table class="carnet" id="carnet">
  <thead><tr><th>St.</th><th>De</th><th>À</th><th>AR [m]</th><th>AV [m]</th><th>Δh [m]</th><th>H brute [m]</th><th>Corr. [mm]</th><th>H comp. [m]</th><th></th></tr></thead>
  <tbody></tbody>
  <tfoot><tr><td colspan="3">Σ</td><td class="o" id="sAR"></td><td class="o" id="sAV"></td><td class="o" id="sDH"></td><td colspan="4"></td></tr></tfoot>
</table>
</div>
<p id="ferm"></p>

<script type="text/markdown">
Compensation simple : l'écart est réparti à parts égales entre les stations.

:::retenir
Contrôle de calcul : **Σ AR − Σ AV = Σ Δh**. Sur un cheminement fermé, Σ Δh est l'**écart de fermeture**. On ne compense que si cet écart est dans la tolérance.
:::

:::attention
Une fermeture parfaite ne prouve pas que tout est juste : deux fautes de même valeur et de signe contraire s'annulent.
:::

:::terrain
Les niveaux numériques lisent une mire à code-barres et enregistrent eux-mêmes les lectures. Le principe du carnet reste identique.
:::

## À vous

:::exo 10 min, seul
Depuis le repère RP2 (H = 512.640 m), on mesure : station 1, AR 1.254, AV 2.031 ; station 2, AR 0.986, AV 1.612. Quelle est l'altitude du point d'arrivée ?

??? Solution
Δh₁ = 1.254 − 2.031 = −0.777 m ; Δh₂ = 0.986 − 1.612 = −0.626 m.

H = 512.640 − 0.777 − 0.626 = **511.237 m**. Contrôle : Σ AR − Σ AV = 2.240 − 3.643 = −1.403 m ✓
???
:::
</script>

</main>
<script>
// ---- composant interactif : carnet de nivellement ----
(function(){
  const $ = id => document.getElementById(id);
  const DEF = [['RP1','P1','1.4325','0.8712'],['P1','P2','1.9054','1.2210'],['P2','P3','0.7120','2.0436'],['P3','RP1','1.1023','1.0134']];
  let rows = GEO.store.get('niv.rows', DEF);
  const tb = document.querySelector('#carnet tbody');
  const n = v => { const x = parseFloat(String(v).replace(',', '.')); return isFinite(x) ? x : NaN; };
  const sgn = (v, d) => isFinite(v) ? `<span class="${v > 0 ? 'pos' : v < 0 ? 'neg' : ''}">${v > 0 ? '+' : ''}${v.toFixed(d)}</span>` : '–';
  function render(){
    tb.innerHTML = rows.map((r, i) => `<tr data-i="${i}"><td class="o">${i+1}</td>
      <td><input class="pt" data-k="0" value="${GEO.esc(r[0])}" aria-label="Point arrière ${i+1}"></td>
      <td><input class="pt" data-k="1" value="${GEO.esc(r[1])}" aria-label="Point avant ${i+1}"></td>
      <td><input data-k="2" inputmode="decimal" value="${r[2]}" aria-label="Lecture arrière ${i+1}"></td>
      <td><input data-k="3" inputmode="decimal" value="${r[3]}" aria-label="Lecture avant ${i+1}"></td>
      <td class="o dh"></td><td class="o hb"></td><td class="o co"></td><td class="o hc"></td>
      <td><button class="del" type="button" aria-label="Supprimer la station ${i+1}">×</button></td></tr>`).join('');
    calc();
  }
  function calc(){
    const H0 = n($('h0').value), tol = n($('tol').value);
    let H = H0, Hc = H0, sAR = 0, sAV = 0;
    const dh = rows.map(r => n(r[2]) - n(r[3]));
    rows.forEach(r => { sAR += n(r[2]); sAV += n(r[3]); });
    const f = dh.reduce((a, b) => a + b, 0);
    const closed = rows.length && rows[0][0].trim() === rows[rows.length-1][1].trim();
    const ok = closed && isFinite(f) && Math.abs(f*1000) <= tol;
    const corr = ok ? -f / rows.length : 0;
    [...tb.rows].forEach((tr, i) => {
      H += dh[i]; Hc += dh[i] + corr;
      tr.querySelector('.dh').innerHTML = sgn(dh[i], 4);
      tr.querySelector('.hb').textContent = isFinite(H) ? H.toFixed(4) : '–';
      tr.querySelector('.co').textContent = ok ? (corr*1000).toFixed(2) : '';
      tr.querySelector('.hc').textContent = ok && isFinite(Hc) ? Hc.toFixed(4) : '';
    });
    $('sAR').textContent = isFinite(sAR) ? sAR.toFixed(4) : '–';
    $('sAV').textContent = isFinite(sAV) ? sAV.toFixed(4) : '–';
    $('sDH').innerHTML = sgn(f, 4);
    $('ferm').innerHTML = !closed ? '<span class="chip warn">cheminement ouvert</span> pas de fermeture à contrôler.'
      : !isFinite(f) ? '<span class="chip err">lecture invalide</span>'
      : ok ? `<span class="chip ok">dans la tolérance</span> fermeture ${(f*1000).toFixed(1)} mm ≤ ${tol} mm, compensée.`
      : `<span class="chip err">hors tolérance</span> fermeture ${(f*1000).toFixed(1)} mm > ${tol} mm : chercher la faute.`;
    GEO.store.set('niv.rows', rows);
  }
  tb.addEventListener('input', e => { const tr = e.target.closest('tr'); if(!tr || e.target.dataset.k === undefined) return; rows[+tr.dataset.i][+e.target.dataset.k] = e.target.value; calc(); });
  tb.addEventListener('click', e => { if(!e.target.classList.contains('del')) return; rows.splice(+e.target.closest('tr').dataset.i, 1); render(); });
  $('add').onclick = () => { const last = rows[rows.length-1]; rows.push([last ? last[1] : 'RP1', 'P' + (rows.length + 1), '', '']); render(); };
  $('reset').onclick = () => { rows = DEF.map(r => [...r]); $('h0').value = 452.318; render(); };
  $('h0').oninput = $('tol').oninput = calc;
  render();
})();
</script>
</body>
</html>
