<script type="text/markdown">
## Le parcours

Les chapitres se suivent, mais chacun peut être lu seul. Les durées sont des exemples.

<div data-plan></div>

## Ce que montre ce gabarit

Chaque chapitre associe un **thème** à une **forme de page**. Les thèmes seront remplacés ; les formes se réutilisent pour n'importe quel sujet.

| Chapitre | Forme démontrée | Réutilisable pour… |
|---|---|---|
| 1 | Carte cliquable + calculateur | Conversions, formules, exercices de calcul |
| 2 | Simulation animée avec réglages | Tout phénomène qu'on veut « faire varier » |
| 3 | Carnet de terrain qui se calcule | Carnets, polygonales, compensations simples |
| 4 | Graphique filtrable avec curseur | Profils, séries de mesures, classifications |
| 5 | Outil SIG + code qui suit les réglages | Requêtes, géotraitements, scripts |
| 6 | Quiz corrigé | Contrôle des acquis |
| A, B | Fiche imprimable, guide de rédaction | Résumé d'examen, documentation des auteurs |

## Comment lire ce support

:::retenir
L'essentiel du chapitre. C'est ce qui sera demandé.
:::

:::attention
Un piège fréquent, une erreur classique.
:::

:::terrain
Où vous rencontrerez cela dans votre métier.
:::

:::exo
À faire seul ou à deux, avec solution à déplier.
:::

Chaque chapitre commence par des objectifs à cocher ; le navigateur s'en souvient. Raccourcis : ++←++ ++→++ pour changer de chapitre, ++P++ pour agrandir le texte au beamer, ++N++ pour annoter.

:::info Vos annotations
Activez **Mode annotation** dans le menu (ou ++N++), survolez n'importe quel bloc et cliquez sur **+** pour y attacher une note, une question ou une correction.

Les annotations restent dans votre navigateur. Le menu **Annotations** permet de les **exporter** dans un fichier JSON et de les **réimporter** plus tard, sur un autre poste, ou de recevoir celles du formateur.
:::

:::info Application hors ligne
Ce support s'installe comme une application, sur ordinateur, tablette ou téléphone, et fonctionne ensuite **sans connexion**.

- **Ordinateur** (Edge, Chrome) : bouton « Installer l'appli » dans le menu, ou icône d'installation dans la barre d'adresse.
- **Android** : menu du navigateur → « Installer l'application ».
- **iPhone / iPad** (Safari) : Partager → « Sur l'écran d'accueil ».

Il suffit d'avoir ouvert le site une fois en ligne. Les mises à jour arrivent automatiquement à la connexion suivante.
:::

## Questions pour la séance de brainstorming

1. **Public et durée** : quel module, combien de périodes, quel niveau de départ ?
2. **Fil rouge** : un seul jeu de données pour tout le cours, ou un exemple par chapitre ?
3. **Part d'interactif** : quelles notions gagnent vraiment à être manipulées plutôt que lues ?
4. **Papier ou écran** : faut-il aussi un support Word / PDF au gabarit CF-geo ?
5. **Exercices** : solutions visibles dans le support, ou réservées au formateur ?
6. **Maintenance** : qui écrit, qui relit, comment on suit les versions (ce dépôt git) ?

// ---- animation de l'accueil : balayage LiDAR ----
(function(){
  const NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('scan');
  const W = 520, BX0 = 300, BX1 = 362, BT = 196;
  const gnd = x => 292 - 16*Math.sin(x/70) - 8*Math.sin(x/23 + 1);
  const TREES = [{cx:118, r:21}, {cx:172, r:17}, {cx:440, r:24}].map(t => ({...t, cy: gnd(t.cx) - 50 - t.r/2}));
  function hit(x){
    let y = gnd(x), c = 'sol';
    if(x >= BX0 && x <= BX1 && BT < y){ y = BT; c = 'bat'; }
    for(const t of TREES){ const d = x - t.cx; if(Math.abs(d) < t.r){ const yc = t.cy - Math.sqrt(t.r*t.r - d*d); if(yc < y){ y = yc; c = 'veg'; } } }
    return [y, c];
  }
  let d = `M0 340 L0 ${gnd(0)}`; for(let x = 0; x <= W; x += 4) d += ` L${x} ${gnd(x).toFixed(1)}`; d += ` L${W} 340Z`;
  svg.querySelector('#terrain').innerHTML = `<path class="gnd" d="${d}"/><path class="bld" d="M${BX0} ${gnd(BX0)+4}V${BT}H${BX1}V${gnd(BX1)+4}"/>` +
    TREES.map(t => `<path class="trunk" d="M${t.cx} ${gnd(t.cx)}V${t.cy}"/><circle class="crown" cx="${t.cx}" cy="${t.cy}" r="${t.r}"/>`).join('');
  const pts = svg.querySelector('#pts'), plane = svg.querySelector('#plane');
  const dot = (x, y, c) => { const e = document.createElementNS(NS, 'circle'); e.setAttribute('cx', x.toFixed(1)); e.setAttribute('cy', (y-1.5).toFixed(1)); e.setAttribute('r', 2.1); e.setAttribute('class', 'p-' + c); pts.appendChild(e); };
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){
    for(let x = 4; x < W; x += 5){ const [y, c] = hit(x); dot(x, y, c); }
    plane.setAttribute('transform', 'translate(260 60)');
    return;
  }
  const line = document.createElementNS(NS, 'line'); line.setAttribute('class', 'beam'); svg.querySelector('#beam').appendChild(line);
  let t0 = null, lastX = -999;
  function frame(now){
    if(t0 === null) t0 = now;
    const t = now - t0, px = (t*0.055) % (W + 120) - 60;
    if(px < lastX) pts.replaceChildren();
    lastX = px;
    plane.setAttribute('transform', `translate(${px.toFixed(1)} 60)`);
    const x = px + 70*Math.sin(t/90);
    if(x >= 0 && x <= W){ const [y, c] = hit(x); dot(x, y, c); line.setAttribute('x1', px); line.setAttribute('y1', 64); line.setAttribute('x2', x); line.setAttribute('y2', y); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
