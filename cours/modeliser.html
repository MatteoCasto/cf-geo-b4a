## Du terrain au modèle, en trois gestes

Un modèle de données est une **simplification volontaire** de la réalité, faite pour un usage précis. Le même terrain donne des modèles différents selon qu'on s'occupe des arbres, de l'éclairage public ou des eaux.

<script type="text/markdown">
:::retenir
1. **Choisir** ce qui est utile pour le mandat, et laisser le reste.
2. **Abstraire** : décider comment représenter chaque chose (point, ligne, surface, ou pas de géométrie du tout).
3. **Décrire** : regrouper les choses semblables en classes, et lister leurs attributs avec un type.

Un modèle n'est jamais « vrai » ou « faux » dans l'absolu. Il est adapté, ou non, à l'usage prévu.
:::

## Le vocabulaire de base

Ces mots reviendront dans tous les chapitres. Ils sont les mêmes en INTERLIS 1 et 2, sauf que INTERLIS 1 dit *table* là où INTERLIS 2 dit *classe*.

| Terme | Ce que c'est | À Montavaux |
|---|---|---|
| **Modèle de données** | La description complète de ce qu'on échange. | `Arbres_Communaux_V1` |
| **Classe** <span class="muted small">(ILI 1 : table)</span> | Un type de chose, avec une fiche commune. | `Arbre`, `Espece` |
| **Objet** | Une chose concrète, un exemplaire de la classe. | l'arbre A-0042 |
| **Attribut** | Une case de la fiche. | `Hauteur` |
| **Type** <span class="muted small">(domaine de valeurs)</span> | Les valeurs permises pour un attribut. | 0.0 à 60.0 m |
| **Identifiant** | Un attribut (ou une combinaison) qui distingue chaque objet. | `NumeroInventaire` |
| **Relation** <span class="muted small">(association)</span> | Un lien entre objets de deux classes. | un arbre est d'une espèce |

---

<div class="two">
  <div class="box"><span class="lab">Classe</span><p>La fiche vierge : « un arbre a un numéro, une espèce, une hauteur, un état, une position ».</p></div>
  <div class="box"><span class="lab">Objet</span><p>Une fiche remplie : « A-0042, <i>Tilia cordata</i>, 12.5 m, affaibli, 2538214.250 / 1152388.100 ».</p></div>
</div>

:::attention
Le modèle ne contient **aucune donnée**. Il ne dit pas qu'il existe un arbre A-0042. Il dit à quoi doit ressembler la fiche de *n'importe quel* arbre. Les données sont dans le fichier de transfert.
:::

:::plus Deux sortes d'identifiants
Dans un fichier de transfert, chaque objet porte un **identifiant technique** (le `TID` en INTERLIS) : il sert seulement à relier les objets entre eux dans le fichier, par exemple un arbre à son espèce. Il n'a pas de sens pour un humain et peut changer d'une livraison à l'autre.

L'**identifiant métier**, lui, fait partie des attributs du modèle : `NumeroInventaire` pour un arbre, le numéro d'un bien-fonds pour la mensuration officielle. C'est lui qu'on écrit sur une plaquette, dans un rapport ou au téléphone. Le modèle peut exiger qu'il soit unique (voir [Le modèle qui dit non](contraintes.html)).
:::

## Quel type pour quel attribut ?

Pour chaque attribut, choisissez le type le plus adapté. La correction s'affiche tout de suite.

<script type="text/markdown">
## Obligatoire ou facultatif ?

Pour chaque attribut, il faut aussi décider s'il doit **toujours** avoir une valeur. Un arbre sans position n'a aucun sens dans l'inventaire : la position est **obligatoire**. En revanche, on ne connaît pas toujours l'année de plantation d'un vieux chêne : elle reste **facultative**.

Ce choix a une conséquence directe. Un attribut obligatoire vide rendra le fichier invalide lors du contrôle (voir [Contrôler les données](controler.html)). Si on rend tout obligatoire, les livraisons seront bloquées pour des détails. Si rien ne l'est, les données seront incomplètes.

:::terrain
Avant de créer un modèle, cherchez s'il en existe déjà un. La Confédération publie les modèles de géodonnées minimaux, et de nombreux cantons publient leurs propres modèles. Réutiliser un modèle existant, c'est gagner du temps et pouvoir échanger avec d'autres dès le premier jour.
:::

:::plus Choisir, dans la mensuration officielle
La mensuration officielle montre bien ce que « choisir » veut dire : un point limite y est décrit par sa position, sa précision, sa fiabilité et sa matérialisation (borne, cheville, croix…). Ni la couleur ni l'état de la borne ne sont enregistrés : ce n'est pas utile au registre foncier.
:::

## À vous : les bancs publics

:::exo papier · 20 min, groupes de 3
Le service de la voirie de Montavaux veut inventorier ses **bancs publics** pour planifier leur entretien (peinture, remplacement des lattes, vandalisme).

1. **Choisir** : quelles informations sont utiles pour ce mandat ? Lesquelles sont inutiles ?
2. **Abstraire** : un banc est-il un point, une ligne ou une surface ? Justifiez.
3. **Décrire** : dessinez la classe `Banc` avec 5 à 7 attributs. Pour chacun : type, obligatoire ou non.

??? Une solution possible
| Attribut | Type | Oblig. |
|---|---|---|
| `Numero` | texte, 8 caractères (« B-0012 ») | oui |
| `Position` | point MN95 | oui |
| `Orientation` | angle 0 à 400 gon (vers où regarde-t-on ?) | non |
| `Materiau` | énumération : bois, métal, béton, mixte | oui |
| `Places` | entier de 1 à 10 | non |
| `AnneePose` | entier de 1900 à 2100 | non |
| `Etat` | énumération : bon, à repeindre, à réparer, à remplacer | oui |

Le point suffit : un banc mesure 2 m, c'est négligeable à l'échelle d'un plan d'entretien. L'orientation est un bon exemple d'attribut qu'on oublie souvent, et qu'on regrette à l'heure de dessiner le symbole sur le plan.
???
:::

---

:::exo discussion · 5 min
Dans la classe `Arbre`, on a mis `Espece : texte`. Que se passe-t-il si une personne saisit « Tilia cordata », une autre « tilia cordata » et une troisième « Tilleul » ? Proposez une meilleure solution.

??? Réponse
On obtient trois espèces différentes pour un seul arbre réel, et les statistiques par espèce sont fausses. Mieux : créer une **classe `Espece`** séparée (nom latin, nom français) et **relier** chaque arbre à une espèce. On saisit l'espèce une seule fois, puis on la choisit dans une liste. C'est une *relation* (INTERLIS 1) ou une *association* (INTERLIS 2). On la verra dans les chapitres INTERLIS 1 et INTERLIS 2.
???
:::

<script>
// ---- composants interactifs de la page ----
(function(){
  /* ---------- croquis en quatre étapes ---------- */
  const TXT = [
    "<strong>Le terrain.</strong> Un bout de Montavaux vu d'en haut : une rue, des maisons, une haie, un ruisseau, des lampadaires, un banc et cinq arbres. La réalité contient une infinité de détails. Il faut décider lesquels comptent.",
    "<strong>Choisir.</strong> Le mandat est l'inventaire des arbres. On garde les arbres et on laisse le reste de côté. Ce n'est pas faux, c'est hors sujet. Pour un mandat d'éclairage public, on aurait gardé les lampadaires et ignoré les arbres.",
    "<strong>Abstraire.</strong> Chaque arbre devient un point : la position du tronc. On renonce à la forme de la couronne. On aurait pu choisir un cercle ou une surface : c'est un choix de modélisation, qui dépend de l'usage.",
    "<strong>Décrire.</strong> Les cinq arbres ont la même « fiche » : c'est une <strong>classe</strong>, <code>Arbre</code>. Chaque arbre est un <strong>objet</strong> de cette classe. Les cases de la fiche sont les <strong>attributs</strong>, chacun avec un <strong>type</strong>.",
  ];
  const scene = document.getElementById('scene'), btns = document.querySelectorAll('#steps button');
  const go = s => {
    scene.dataset.s = s;
    btns.forEach(b => b.setAttribute('aria-pressed', b.dataset.s == s));
    document.getElementById('stepTxt').innerHTML = TXT[s];
  };
  btns.forEach(b => b.onclick = () => go(+b.dataset.s));
  addEventListener('keydown', e => {
    if(e.altKey || e.ctrlKey || e.metaKey || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.isContentEditable) return;
    if(/^[0-3]$/.test(e.key)) go(+e.key);
  });
  go(0);
  // version figée (impression) : les quatre étapes, avec les mêmes textes
  document.getElementById('stepsFige').innerHTML = '<p><strong>Choisir, abstraire, décrire : un bout de Montavaux, du terrain à la classe Arbre.</strong></p><ol start="0">' +
    TXT.map(t => `<li>${t}</li>`).join('') + '</ol>';

  /* ---------- choix des types ---------- */
  const TYPES = ['— choisir —','Texte','Nombre entier','Nombre décimal + unité','Énumération','Coordonnée (point)','Date'];
  const Q = [
    {a:'NumeroInventaire', v:'A-0042', ok:'Texte',
     fb:{'Texte':"Oui. Il contient une lettre et un tiret, et le zéro de tête compte : « A-0042 » n'est pas un nombre.",
         'Nombre entier':"Non : « A-0042 » contient des lettres, et un nombre perdrait les zéros de tête (0042 → 42).",
         '*':"Non : c'est un code. Même quand un identifiant ne contient que des chiffres, on le traite comme du texte."}},
    {a:'Hauteur', v:'12.5', ok:'Nombre décimal + unité',
     fb:{'Nombre décimal + unité':"Oui. On précise l'unité (m) et une plage réaliste, par exemple 0.0 à 60.0.",
         'Nombre entier':"Presque : on veut des décimales (12.5 m), et surtout une unité.",
         '*':"Non : c'est une mesure. Il faut un nombre, avec son unité et une plage de valeurs."}},
    {a:'Etat', v:'affaibli', ok:'Énumération',
     fb:{'Énumération':"Oui. Liste fermée : sain, affaibli, malade, mort. Impossible de saisir « malad » ou « Affaibli ».",
         'Texte':"Possible, mais dangereux : chacun écrira l'état à sa façon, et on ne pourra plus compter les arbres malades.",
         '*':"Non : il y a un petit nombre de valeurs connues à l'avance. C'est le cas typique de l'énumération."}},
    {a:'AnneePlantation', v:'1987', ok:'Nombre entier',
     fb:{'Nombre entier':"Oui, avec une plage : 1800 à 2100 par exemple.",
         'Date':"Tentant, mais une date demande jour, mois et année. On ne connaît que l'année : un entier suffit.",
         '*':"Non : c'est une année seule. Un entier avec une plage raisonnable suffit."}},
    {a:'Position', v:'2538214.250 / 1152388.100', ok:'Coordonnée (point)',
     fb:{'Coordonnée (point)':"Oui. Une coordonnée 2D dans le domaine MN95 (E 2 460 000 à 2 870 000, N 1 045 000 à 1 310 000).",
         'Texte':"Non : sous forme de texte, aucun logiciel ne pourra placer l'arbre sur une carte, ni vérifier qu'il est en Suisse.",
         '*':"Non : c'est une géométrie. INTERLIS a un type dédié aux coordonnées."}},
    {a:'Remarque', v:'Tuteur à retirer en 2027', ok:'Texte',
     fb:{'Texte':"Oui. Un texte libre, facultatif, avec une longueur maximale (200 caractères par exemple).",
         '*':"Non : c'est une note libre, sans structure. Un texte facultatif convient."}},
  ];
  const tb = document.querySelector('#typ tbody');
  tb.innerHTML = Q.map((q, i) => `<tr data-i="${i}"><td><code>${q.a}</code></td><td class="mono small">${GEO.esc(q.v)}</td>
    <td><select aria-label="Type pour ${q.a}">${TYPES.map(t => `<option>${t}</option>`).join('')}</select></td><td class="fb"></td></tr>`).join('');
  const score = () => {
    const n = tb.querySelectorAll('tr.good').length, d = tb.querySelectorAll('tr.good,tr.bad').length;
    document.getElementById('typScore').textContent = d ? `${n} bonne${n>1?'s':''} réponse${n>1?'s':''} sur ${Q.length}.` : '';
  };
  // version figée (impression) : la bonne réponse pour chaque attribut, avec son explication
  document.getElementById('typFige').innerHTML = '<p><strong>Quel type pour quel attribut ? Les réponses.</strong></p><div class="tbl"><table><thead><tr><th>Attribut</th><th>Exemple</th><th>Type adapté</th><th>Pourquoi</th></tr></thead><tbody>' +
    Q.map(q => `<tr><td><code>${q.a}</code></td><td>${GEO.esc(q.v)}</td><td>${q.ok}</td><td>${GEO.esc(q.fb[q.ok].replace(/^Oui[.,]\s*/, '').replace(/^./, c => c.toUpperCase()))}</td></tr>`).join('') + '</tbody></table></div>';
  tb.querySelectorAll('tr').forEach(tr => {
    const q = Q[+tr.dataset.i], sel = tr.querySelector('select'), fb = tr.querySelector('.fb');
    sel.onchange = () => {
      const v = sel.value;
      tr.classList.remove('good','bad');
      if(v === TYPES[0]){ fb.textContent = ''; score(); return; }
      tr.classList.add(v === q.ok ? 'good' : 'bad');
      fb.textContent = q.fb[v] || q.fb['*'];
      score();
    };
  });
})();
</script>
