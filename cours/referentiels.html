## Cliquer sur la carte

Cliquez n'importe où en Suisse. Le point s'affiche dans les deux cadres. Remarquez que seul le **premier chiffre** change en apparence.

<script type="text/markdown">
:::retenir
En **MN95**, l'est commence par **2** et le nord par **1** (7 chiffres avant la virgule). En **MN03**, ils ont 6 chiffres.

L'origine vaut `2 600 000 / 1 200 000` en MN95 et `600 000 / 200 000` en MN03.
:::

## Convertir

Tapez une coordonnée dans l'un ou l'autre cadre : l'autre se met à jour. Le calcul est une simple translation.
</script>

<!-- composant interactif : convertisseur -->

<script type="text/markdown">
```py mn03_vers_mn95.py
# Approximation : translation pure (écart réel jusqu'à ~1,6 m)
def mn03_vers_mn95(y, x):
    return y + 2_000_000, x + 1_000_000

print(mn03_vers_mn95(538214.25, 152386.70))   # (2538214.25, 1152386.7)
```

:::attention
MN03 contient des déformations locales héritées de la triangulation. La translation donne donc une valeur **approchée** : l'écart avec la transformation officielle peut dépasser le mètre. Pour la mensuration, cette approximation est inacceptable.
:::

:::terrain
Pour une transformation rigoureuse, swisstopo met à disposition **REFRAME** (en ligne, en logiciel et en bibliothèque).
:::

## Deux cadres côte à côte

| | MN03 | MN95 |
|---|---|---|
| Cadre géodésique | CH1903 | CH1903+ |
| Origine | 600 000 / 200 000 | 2 600 000 / 1 200 000 |
| Noms des axes | Y (est), X (nord) | E (est), N (nord) |
| Origine des mesures | Triangulation classique | Mesures GNSS |
| Usage aujourd'hui | Anciennes données, archives | Cadre de référence officiel |

## À vous

:::exo 5 min, seul
Un bureau vous transmet trois points. Pour chacun, dites dans quel cadre il est donné et s'il peut être en Suisse.

1. `2 683 250 / 1 247 900`
2. `717 100 / 96 200`
3. `1 200 000 / 2 600 000`

??? Solution
1. MN95 (7 chiffres, commence par 2 / 1). Région de Zurich.
2. MN03 (6 chiffres ; le nord n'en a que 5 car il est inférieur à 100 000). Région de Lugano.
3. Est et nord sont **inversés**. Erreur classique lors d'un import CSV : vérifier l'ordre des colonnes.
???
:::

<script>
// ---- composants interactifs de cette page ----
(function(){
  const $ = id => document.getElementById(id), f = GEO.fmtCH;
  const E0 = 2480000, N1 = 1300000, K = 500;                 // 1 px = 500 m
  const px = (e, n) => [(e - E0)/K, (N1 - n)/K];
  const toEN = (x, y) => [E0 + x*K, N1 - y*K];
  const C = [[2485,1112],[2497,1128],[2515,1173],[2533,1193],[2548,1212],[2567,1232],[2565,1253],[2585,1262],[2611,1268],[2640,1266],[2668,1272],
    [2688,1296],[2706,1283],[2732,1279],[2756,1263],[2764,1236],[2758,1222],[2782,1208],[2806,1198],[2831,1196],[2832,1168],[2812,1152],[2805,1124],
    [2783,1133],[2755,1130],[2737,1112],[2722,1078],[2707,1086],[2698,1108],[2672,1112],[2662,1133],[2647,1110],[2630,1084],[2615,1090],[2581,1081],
    [2567,1093],[2554,1135],[2525,1140],[2505,1124]];
  $('ctry').setAttribute('d', 'M' + C.map(([e,n]) => px(e*1000, n*1000).map(v=>v.toFixed(1)).join(' ')).join('L') + 'Z');
  let g = '';
  for(let e = 2500000; e <= 2800000; e += 50000){ const [x] = px(e, 0); g += `<line x1="${x}" y1="0" x2="${x}" y2="460"/><text x="${x+3}" y="454">${e/1000}</text>`; }
  for(let n = 1100000; n <= 1300000; n += 50000){ const [, y] = px(0, n); g += `<line x1="0" y1="${y}" x2="720" y2="${y}"/><text x="3" y="${y-3}">${n/1000}</text>`; }
  $('grid').innerHTML = g;
  const CITIES = [['Berne',2600000,1200000],['Genève',2500100,1117900],['Lausanne',2538200,1152400],['Sion',2593900,1120000],['Neuchâtel',2561300,1205200],
    ['Bâle',2611300,1267200],['Lucerne',2666200,1211400],['Zurich',2683200,1247900],['Saint-Gall',2746100,1254400],['Coire',2759300,1190700],['Lugano',2717100,1096200]];
  $('cities').innerHTML = CITIES.map(([t,e,n]) => { const [x,y] = px(e,n); return `<g class="city${t==='Berne'?' bern':''}"><circle cx="${x}" cy="${y}" r="${t==='Berne'?5:3.2}"/><text x="${x+7}" y="${y+4}">${t}</text></g>`; }).join('');
  function show(e, n){
    $('e95').textContent = f(e, 1); $('n95').textContent = f(n, 1);
    $('y03').textContent = f(e - 2e6, 1); $('x03').textContent = f(n - 1e6, 1);
    const near = CITIES.map(([t,ce,cn]) => [t, Math.hypot(e-ce, n-cn)]).sort((a,b)=>a[1]-b[1])[0];
    $('near').textContent = `${near[0]} (${(near[1]/1000).toFixed(1)} km)`;
    const [x, y] = px(e, n), pk = $('pick');
    pk.style.display = ''; pk.setAttribute('transform', `translate(${x} ${y})`);
  }
  const svg = $('ch');
  svg.addEventListener('click', ev => {
    const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    show(...toEN(p.x, p.y));
  });
  const num = s => parseFloat(String(s).replace(/['\s’]/g, '').replace(',', '.'));
  const I = {E:$('iE'), N:$('iN'), Y:$('iY'), X:$('iX')};
  function check(e, n){
    const ok = e > 2480000 && e < 2840000 && n > 1070000 && n < 1300000;
    $('convMsg').innerHTML = ok ? '<span class="chip ok">en Suisse</span> point plausible, affiché sur la carte.'
                                : '<span class="chip warn">hors Suisse</span> vérifier le cadre et l\'ordre est / nord.';
    if(ok) show(e, n);
  }
  function from95(){ const e = num(I.E.value), n = num(I.N.value); if(isFinite(e)) I.Y.value = (e - 2e6).toFixed(2); if(isFinite(n)) I.X.value = (n - 1e6).toFixed(2); check(e, n); }
  function from03(){ const y = num(I.Y.value), x = num(I.X.value); if(isFinite(y)) I.E.value = (y + 2e6).toFixed(2); if(isFinite(x)) I.N.value = (x + 1e6).toFixed(2); check(y + 2e6, x + 1e6); }
  I.E.oninput = I.N.oninput = from95;
  I.Y.oninput = I.X.oninput = from03;
  from95();
})();
</script>
